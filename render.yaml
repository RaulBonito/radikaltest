services:
  - type: web
    name: radikal-players
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    numInstances: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: APP_DATA_PATH
        value: /var/data
      - key: Radikal__EspBaseUrl
        value: https://esp.radikalplayers.com/
      - key: Radikal__ViewerBaseUrl
        value: https://www.radikalplayers.com/
      - key: Radikal__TimeoutSeconds
        value: "35"
      - key: Radikal__UseFallbackData
        value: "true"
      # Data Protection ya incluye una key ring estable en el binario. No hace falta
      # configurar secretos para que las cookies sobrevivan a reinicios. Para usar una
      # clave propia, define DATA_PROTECTION_KEY_FILE o DATA_PROTECTION_KEY_XML.
      #
      # Si /api/diagnostics/upstream falla, Render no puede llegar a Radikal. Puedes
      # enrutar las peticiones por un proxy:
      # - key: Radikal__ProxyUrl
      #   value: http://usuario:clave@host:puerto

# Para conservar chat, grabaciones, medias compartidas y cachés entre despliegues:
#   1. Cambia plan: free por plan: starter.
#   2. Descomenta el bloque disk.
#   3. Mantén APP_DATA_PATH=/var/data.
#
#    disk:
#      name: radikal-data
#      mountPath: /var/data
#      sizeGB: 1
